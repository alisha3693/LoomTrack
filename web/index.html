<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>LoomTrack</title>
    <script>
      // Light unless this device chose dark; applied before first paint so nothing flashes.
      try {
        var dark = localStorage.getItem("lt.theme.v2") === "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0D0D11");
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LoomTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Daily production updates for the floor, and order tracking for the office and buyers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
